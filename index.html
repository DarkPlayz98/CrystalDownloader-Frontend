<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Downloader</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; text-align: center; padding: 0 20px; }
        input { width: 100%; box-sizing: border-box; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; }
        button { padding: 12px 24px; cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 6px; font-weight: bold; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        img { max-width: 100%; margin-top: 15px; border-radius: 8px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); border-left-color: #007bff; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .error { color: #d93025; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <h2>Universal Downloader</h2>
    <input type="text" id="videoUrl" placeholder="Paste link here...">
    <button id="downloadBtn" onclick="fetchVideo()">Get Download Link</button>
    
    <div id="loadingSpinner" class="spinner"></div>
    <div id="result"></div>

    <script>
        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const resultDiv = document.getElementById('result');
            const spinner = document.getElementById('loadingSpinner');
            const btn = document.getElementById('downloadBtn');

            if (!urlInput) {
                resultDiv.innerHTML = '<p class="error">Please enter a valid URL.</p>';
                return;
            }

            resultDiv.innerHTML = '';
            spinner.style.display = 'block';
            btn.disabled = true;
            btn.innerText = 'Extracting...';

            try {
                // Set your Render API URL here
                const response = await fetch('https://YOUR_RENDER_URL.onrender.com/api/extract', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: urlInput })
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.error || 'Connection failed.');
                
                if (data.downloadUrl) {
                    resultDiv.innerHTML = `
                        <h3>${data.title || 'Video Found'}</h3>
                        ${data.thumbnail ? `<img src="${data.thumbnail}" alt="Thumbnail">` : ''}
                        <br><br>
                        <a href="${data.downloadUrl}" target="_blank" rel="noopener noreferrer" style="display: inline-block; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 6px;">Download Video</a>
                    `;
                } else {
                    throw new Error('No media found.');
                }
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Error: ${error.message}</p>`;
            } finally {
                spinner.style.display = 'none';
                btn.disabled = false;
                btn.innerText = 'Get Download Link';
            }
        }
    </script>
</body>
</html>
